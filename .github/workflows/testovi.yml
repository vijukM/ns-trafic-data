name: testovi

on:
  push:
    paths: ["prikupljanje/**", "tests/**", ".github/workflows/**"]
  pull_request:

permissions:
  contents: read

jobs:
  testovi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest -q tests
